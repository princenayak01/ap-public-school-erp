name: Upgrade vulnerable Next.js dependencies

on:
  push:
    branches: [security/multi-tenant-isolation-audit]
    paths:
      - ".github/workflows/upgrade-frontend.yml"

permissions:
  contents: write

jobs:
  upgrade-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout security branch
        uses: actions/checkout@v4
        with:
          ref: security/multi-tenant-isolation-audit
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Upgrade Next.js to patched 15.x and PostCSS
        run: |
          npm install next@15.5.29 --save
          npm install postcss@8.5.23 --save-dev

      - name: Build frontend
        run: npm run build

      - name: Verify no high or critical dependency advisories
        run: npm audit --audit-level=high

      - name: Commit lockfile only after all checks pass
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package.json frontend/package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "security: upgrade Next.js and PostCSS to patched releases [skip ci]"
          git push origin HEAD:security/multi-tenant-isolation-audit
