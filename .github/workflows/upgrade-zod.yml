name: Upgrade vulnerable Zod dependency

on:
  push:
    branches: [security/multi-tenant-isolation-audit]
    paths:
      - ".github/workflows/upgrade-zod.yml"

permissions:
  contents: write

jobs:
  upgrade-zod:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: "postgresql://ci:ci@127.0.0.1:5432/ci?schema=public"
      JWT_ACCESS_SECRET: "ci_only_access_secret_0123456789_abcdef"
      JWT_REFRESH_SECRET: "ci_only_refresh_secret_9876543210_abcdef"
      NODE_ENV: test
    steps:
      - name: Checkout security branch
        uses: actions/checkout@v4
        with:
          ref: security/multi-tenant-isolation-audit
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install patched Zod release and refresh lockfile
        run: npm install zod@4.6.7 --save

      - name: Generate Prisma client
        run: npx prisma generate

      - name: TypeScript compatibility build
        run: npm run build

      - name: Verify no high or critical dependency advisories
        run: npm audit --audit-level=high

      - name: Commit lockfile only after all checks pass
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/package.json backend/package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "security: upgrade Zod to patched release [skip ci]"
          git push origin HEAD:security/multi-tenant-isolation-audit
